name: release

# On a version tag, attach the theme file to a GitHub Release. The file's
# sha256 is what mass-registry pins.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          files: synthwave.css
          generate_release_notes: true
